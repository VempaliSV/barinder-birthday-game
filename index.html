<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barinder's Birthday Arcade</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS & Pixel Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Press Start 2P', monospace; }
    </style>
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Global Retro CSS
      const RetroGlobalStyles = () => (
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
          .font-pixel { font-family: 'Press Start 2P', cursive, monospace; }
          * { image-rendering: pixelated; }
          .pixel-border {
            box-shadow: -4px 0 0 0 #000, 4px 0 0 0 #000, 0 -4px 0 0 #000, 0 4px 0 0 #000;
            margin: 4px;
          }
          .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
          }
        `}</style>
      );

      const FireworksCanvas = ({ active }) => {
        const canvasRef = useRef(null);
        useEffect(() => {
          if (!active) return;
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          const particles = [];
          const colors = ['#E52521', '#0090E0', '#FBD000', '#43B047', '#FFFFFF', '#FF00FE'];
          const createExplosion = (x, y) => {
            for (let i = 0; i < 40; i++) {
              const angle = (Math.PI * 2 * i) / 40;
              const speed = Math.random() * 5 + 2;
              particles.push({
                x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                size: Math.random() * 6 + 3, color: colors[Math.floor(Math.random() * colors.length)], life: 60
              });
            }
          };
          let interval = setInterval(() => {
            createExplosion(Math.random() * canvas.width, Math.random() * (canvas.height * 0.6));
          }, 400);
          let animationId;
          const render = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx; p.y += p.vy; p.life -= 1;
              ctx.fillStyle = p.color;
              ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
              if (p.life <= 0) particles.splice(i, 1);
            }
            animationId = requestAnimationFrame(render);
          };
          render();
          return () => { clearInterval(interval); cancelAnimationFrame(animationId); };
        }, [active]);
        if (!active) return null;
        return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-50 w-full h-full" />;
      };

      const DEFAULT_TRIVIA = [
        { round: 1, difficulty: "WORLD 1-1: EASY", question: "What is Barinder's absolute favorite go-to comfort meal?", options: ["Butter Chicken & Naan", "Pizza & Garlic Dip", "Gourmet Burgers", "Fresh Sushi Combo"], correctIndex: 0, points: 100 },
        { round: 2, difficulty: "WORLD 1-2: MEDIUM", question: "How does Barinder prefer his morning brew to power up?", options: ["Black Espresso", "Hot Ginger Chai", "Iced Vanilla Latte", "Green Tea"], correctIndex: 1, points: 200 },
        { round: 3, difficulty: "WORLD 1-3: HARD", question: "What is Barinder's secret guilty pleasure pastime on weekends?", options: ["Bingeing tech videos", "Online gadget shopping", "Long afternoon nap", "Gaming till 3 AM"], correctIndex: 0, points: 300 },
        { round: 4, difficulty: "WORLD 1-4: EXPERT", question: "Which iconic habit is Barinder most famous for among friends?", options: ["Checking locks 3 times", "Hyper-detailed travel plans", "45-minute hot showers", "Losing his keys daily"], correctIndex: 1, points: 400 },
        { round: 5, difficulty: "BOWSER'S CASTLE: ULTIMATE", question: "If Barinder won a lifetime supply of one thing, what would he choose?", options: ["Flight Tickets", "Fresh Cookies", "Sneakers", "Coffee Beans"], correctIndex: 0, points: 500 }
      ];

      function App() {
        const [activeTab, setActiveTab] = useState('hub');
        const [soundEnabled, setSoundEnabled] = useState(true);
        const [fireworksActive, setFireworksActive] = useState(false);
        const [coins, setCoins] = useState(99);
        const [l1Round, setL1Round] = useState(0);
        const [l1Revealed, setL1Revealed] = useState(0);

        const playRetroSound = (type) => {
          if (!soundEnabled) return;
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'powerup') {
              osc.type = 'triangle';
              [330, 392, 659, 523].forEach((freq, i) => osc.frequency.setValueAtTime(freq, now + i * 0.05));
              gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
              osc.start(now); osc.stop(now + 0.35);
            }
          } catch (e) {}
        };

        return (
          <div className="min-h-screen bg-[#2b201a] text-white font-pixel scanlines flex flex-col justify-between selection:bg-yellow-400 selection:text-black relative overflow-x-hidden">
            <RetroGlobalStyles />
            <FireworksCanvas active={fireworksActive} />

            <header className="bg-[#0090E0] border-b-4 border-black p-3 text-xs sticky top-0 z-40">
              <div className="max-w-5xl mx-auto flex items-center justify-between">
                <div onClick={() => setActiveTab('hub')} className="cursor-pointer font-black text-yellow-300">
                  {"BARINDER'S B-DAY ARCADE"} 🍄
                </div>
                <button onClick={() => setSoundEnabled(!soundEnabled)} className="p-1 bg-green-600 rounded">
                  {soundEnabled ? '🔊' : '🔇'}
                </button>
              </div>
            </header>

            <main className="max-w-4xl w-full mx-auto p-4 flex-1">
              {activeTab === 'hub' && (
                <div className="space-y-4 text-center">
                  <div className="bg-[#43B047] border-4 border-black p-6 rounded-lg">
                    <h2 className="text-xl text-yellow-300 font-black">{"BARINDER'S BIRTHDAY BASH! 🎉"}</h2>
                    <p className="text-xs my-2">5-Player Online Party Arcade</p>
                    <button onClick={() => setActiveTab('level1')} className="px-4 py-2 bg-red-600 font-bold rounded mt-2">
                      ▶ START GAME
                    </button>
                  </div>
                </div>
              )}

              {activeTab === 'level1' && (
                <div className="bg-red-600 border-4 border-black p-4 rounded-lg space-y-3">
                  <button onClick={() => setActiveTab('hub')} className="text-xs text-yellow-300">{"← MAP"}</button>
                  <h3 className="text-base font-black">{DEFAULT_TRIVIA[l1Round]?.question}</h3>
                  <div className="grid grid-cols-1 gap-2">
                    {DEFAULT_TRIVIA[l1Round]?.options.map((opt, idx) => (
                      <button key={idx} onClick={() => { setL1Revealed(true); if(idx === DEFAULT_TRIVIA[l1Round].correctIndex) playRetroSound('powerup'); }} className="p-3 bg-blue-600 font-bold rounded text-left text-xs">
                        {opt}
                      </button>
                    ))}
                  </div>
                  {l1Revealed && (
                    <button onClick={() => { setL1Revealed(false); setL1Round((r) => (r + 1) % DEFAULT_TRIVIA.length); }} className="w-full py-2 bg-yellow-400 text-black font-bold text-xs rounded">
                      NEXT QUESTION →
                    </button>
                  )}
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
