<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barinder's Birthday Arcade</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs for Real-Time Multiplayer Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Tailwind CSS & Pixel Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Press Start 2P', monospace; }
      .pixel-border { box-shadow: -4px 0 0 0 #000, 4px 0 0 0 #000, 0 -4px 0 0 #000, 0 4px 0 0 #000; margin: 4px; }
      .pixel-border-gold { box-shadow: -4px 0 0 0 #2b201a, 4px 0 0 0 #2b201a, 0 -4px 0 0 #2b201a, 0 4px 0 0 #2b201a, -4px -4px 0 0 #fbd000, 4px 4px 0 0 #fbd000; }
      .scanlines { background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; }
    </style>
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Your Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyB_9eOcXW9Wf6Aiva88dSVow8y8X2EpIHM",
        authDomain: "barinder-birthday-game.firebaseapp.com",
        databaseURL: "https://barinder-birthday-game-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "barinder-birthday-game",
        storageBucket: "barinder-birthday-game.firebasestorage.app",
        messagingSenderId: "52584524307",
        appId: "1:52584524307:web:2cd46526890271f4862de6",
        measurementId: "G-3NNLH2GPNQ"
      };

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();

      const INITIAL_PLAYERS = {
        "Barinder": { name: "Barinder", avatar: "👑", score: 0 },
        "Dikshant": { name: "Dikshant", avatar: "🔴", score: 0 },
        "Mangla": { name: "Mangla", avatar: "🟢", score: 0 },
        "Madhuri": { name: "Madhuri", avatar: "🍄", score: 0 },
        "Divya": { name: "Divya", avatar: "🦖", score: 0 }
      };

      const DEFAULT_TRIVIA = [
        { difficulty: "WORLD 1-1: EASY", question: "What is Barinder's absolute favorite go-to comfort meal?", options: ["Butter Chicken & Naan", "Pizza & Garlic Dip", "Gourmet Burgers", "Fresh Sushi Combo"], correctIndex: 0, points: 100 },
        { difficulty: "WORLD 1-2: MEDIUM", question: "How does Barinder prefer his morning brew to power up?", options: ["Black Espresso", "Hot Ginger Chai", "Iced Vanilla Latte", "Green Tea"], correctIndex: 1, points: 200 },
        { difficulty: "WORLD 1-3: HARD", question: "What is Barinder's secret guilty pleasure pastime on weekends?", options: ["Bingeing tech videos", "Online gadget shopping", "Long afternoon nap", "Gaming till 3 AM"], correctIndex: 0, points: 300 },
        { difficulty: "WORLD 1-4: EXPERT", question: "Which iconic habit is Barinder most famous for among friends?", options: ["Checking locks 3 times", "Hyper-detailed travel plans", "45-minute hot showers", "Losing his keys daily"], correctIndex: 1, points: 400 },
        { difficulty: "BOWSER'S CASTLE: ULTIMATE", question: "If Barinder won a lifetime supply of one thing, what would he choose?", options: ["Flight Tickets", "Fresh Cookies", "Sneakers", "Coffee Beans"], correctIndex: 0, points: 500 }
      ];

      const MOST_LIKELY_QUESTIONS = [
        "Who is most likely to eat the last slice of birthday cake without asking?",
        "Who is most likely to fall asleep first during a late-night movie?",
        "Who is most likely to launch a crazy business idea with Barinder at 2 AM?",
        "Who is most likely to score 100% on Barinder trivia without studying?",
        "Who is most likely to organize an impromptu surprise trip?"
      ];

      const BLUFF_FACTS = [
        { fact: "Barinder once tried to build his own computer and accidentally created a makeshift toaster.", isReal: false, explanation: "Fake! He built a working PC, but it definitely didn't toast bread." },
        { fact: "Bananas are naturally radioactive due to high potassium content.", isReal: true, explanation: "Real! They contain Potassium-40, though completely harmless!" },
        { fact: "Mario was originally named 'Jumpman' in his debut game Donkey Kong.", isReal: true, explanation: "Real! Nintendo later named him Mario after their landlord." },
        { fact: "Wombat poop is shaped like distinct cubes to stop it from rolling away.", isReal: true, explanation: "Real! Wombats use their square droppings to mark territory on rocks and logs." }
      ];

      function App() {
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room') || 'BARINDER-PARTY';

        const [activeTab, setActiveTab] = useState('hub');
        const [myIdentity, setMyIdentity] = useState('Barinder');
        const [showIdentityModal, setShowIdentityModal] = useState(true);

        const [players, setPlayers] = useState(INITIAL_PLAYERS);
        const [l1Round, setL1Round] = useState(0);
        const [l1SelectedOpt, setL1SelectedOpt] = useState(null);
        const [l1Revealed, setL1Revealed] = useState(false);
        const [mlQuestionIdx, setMlQuestionIdx] = useState(0);
        const [bluffIndex, setBluffIndex] = useState(0);
        const [bluffRevealed, setBluffRevealed] = useState(false);
        const [showShareModal, setShowShareModal] = useState(false);
        const [copiedLink, setCopiedLink] = useState(false);

        // Real-Time Firebase Sync Listener
        useEffect(() => {
          const roomRef = db.ref('rooms/' + roomCode);
          roomRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              if (data.players) setPlayers(data.players);
              if (data.l1Round !== undefined) setL1Round(data.l1Round);
              if (data.mlQuestionIdx !== undefined) setMlQuestionIdx(data.mlQuestionIdx);
              if (data.bluffIndex !== undefined) setBluffIndex(data.bluffIndex);
              if (data.activeTab) setActiveTab(data.activeTab);
            } else {
              roomRef.set({ players: INITIAL_PLAYERS, l1Round: 0, mlQuestionIdx: 0, bluffIndex: 0, activeTab: 'hub' });
            }
          });
          return () => roomRef.off();
        }, [roomCode]);

        const changeTab = (tabName) => {
          setActiveTab(tabName);
          db.ref('rooms/' + roomCode).update({ activeTab: tabName });
        };

        const addPoints = (playerName, pts) => {
          const currentScore = players[playerName]?.score || 0;
          const newScore = Math.max(0, currentScore + pts);
          db.ref(`rooms/${roomCode}/players/${playerName}/score`).set(newScore);
        };

        const handleCopyLink = () => {
          const shareUrl = window.location.origin + window.location.pathname + '?room=' + roomCode;
          navigator.clipboard.writeText(shareUrl);
          setCopiedLink(true);
          setTimeout(() => setCopiedLink(false), 3000);
        };

        const handleL1Answer = (optIdx) => {
          if (l1Revealed) return;
          setL1SelectedOpt(optIdx);
          setL1Revealed(true);
          const q = DEFAULT_TRIVIA[l1Round];
          if (optIdx === q.correctIndex) {
            addPoints(myIdentity, q.points);
          }
        };

        return (
          <div className="min-h-screen bg-[#2b201a] text-white font-pixel scanlines flex flex-col justify-between selection:bg-yellow-400 selection:text-black relative overflow-x-hidden">

            {/* IDENTITY SELECTION MODAL */}
            {showIdentityModal && (
              <div className="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4">
                <div className="bg-[#0090E0] border-4 border-black p-6 rounded-lg pixel-border max-w-md w-full space-y-4 text-center">
                  <span className="text-3xl">🍄</span>
                  <h3 className="text-sm md:text-base font-black text-yellow-300 uppercase">WHO ARE YOU PLAYING AS?</h3>
                  <p className="text-[10px] text-blue-100 leading-relaxed">Select your name so your scores sync correctly on everyone's screen!</p>
                  <div className="grid grid-cols-1 gap-2 my-3">
                    {Object.keys(INITIAL_PLAYERS).map(name => (
                      <button
                        key={name}
                        onClick={() => { setMyIdentity(name); setShowIdentityModal(false); }}
                        className={"p-3 rounded border-2 border-black text-xs font-bold flex items-center justify-between " + (myIdentity === name ? 'bg-[#FBD000] text-black' : 'bg-blue-800 text-white hover:bg-blue-700')}
                      >
                        <span>{INITIAL_PLAYERS[name].avatar} {name}</span>
                        {myIdentity === name && <span>✓ SELECTED</span>}
                      </button>
                    ))}
                  </div>
                  <button onClick={() => setShowIdentityModal(false)} className="w-full py-3 bg-[#E52521] text-white font-black text-xs rounded pixel-border">
                    ENTER ARCADE →
                  </button>
                </div>
              </div>
            )}

            {/* SHARE MODAL */}
            {showShareModal && (
              <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                <div className="bg-[#0090E0] border-4 border-black p-6 rounded-lg pixel-border max-w-md w-full space-y-4 text-center">
                  <span className="text-3xl">🎮</span>
                  <h3 className="text-sm md:text-base font-black text-yellow-300 uppercase">LIVE MULTIPLAYER ROOM</h3>
                  <p className="text-[10px] text-blue-100 leading-relaxed">Send this link to Barinder, Dikshant, Mangla, Madhuri, and Divya!</p>
                  <div className="bg-black/60 p-3 rounded border border-black flex items-center justify-between gap-2">
                    <span className="text-[10px] text-yellow-300 truncate font-mono">{window.location.origin}?room={roomCode}</span>
                    <button onClick={handleCopyLink} className="px-3 py-1.5 bg-[#FBD000] text-black font-bold text-[10px] rounded pixel-border">
                      {copiedLink ? 'COPIED!' : 'COPY'}
                    </button>
                  </div>
                  <button onClick={() => setShowShareModal(false)} className="w-full py-2 bg-[#E52521] text-white font-black text-xs rounded pixel-border">
                    CLOSE
                  </button>
                </div>
              </div>
            )}

            <header className="bg-[#0090E0] border-b-4 border-black p-3 md:p-4 text-xs sticky top-0 z-40 shadow-xl">
              <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div onClick={() => changeTab('hub')} className="flex items-center space-x-2 cursor-pointer">
                  <div className="bg-[#E52521] text-white p-2 rounded pixel-border font-extrabold text-sm">🍄</div>
                  <div>
                    <div className="text-[#FBD000] font-black text-sm md:text-base">BARINDER'S B-DAY</div>
                    <div className="text-white text-[10px]">Playing as: <strong className="text-yellow-300">{myIdentity}</strong> (<button onClick={() => setShowIdentityModal(true)} className="underline">Switch</button>)</div>
                  </div>
                </div>
                <div className="flex items-center space-x-3">
                  <button onClick={() => setShowShareModal(true)} className="px-2.5 py-1.5 bg-[#E52521] text-white rounded pixel-border text-[10px] font-bold animate-pulse">
                    🔗 INVITE FRIENDS
                  </button>
                </div>
              </div>

              {/* LIVE LEADERBOARD */}
              <div className="mt-3 pt-2 border-t border-blue-400/50 flex items-center justify-between overflow-x-auto gap-2">
                <span className="text-[10px] text-blue-100 uppercase shrink-0">LIVE SCORES:</span>
                <div className="flex space-x-2">
                  {Object.values(players).map((p) => (
                    <div
                      key={p.name}
                      className={"px-2.5 py-1 rounded text-[9px] flex items-center space-x-1 " + (myIdentity === p.name ? 'bg-[#E52521] text-white pixel-border-gold font-bold scale-105' : 'bg-[#0060a0] text-blue-200')}
                    >
                      <span>{p.avatar}</span>
                      <span className="truncate">{p.name}</span>
                      <span className="text-[#FBD000] font-black">({p.score})</span>
                    </div>
                  ))}
                </div>
              </div>
            </header>

            <main className="max-w-4xl w-full mx-auto p-4 md:p-6 flex-1 flex flex-col justify-center">
              {activeTab === 'hub' && (
                <div className="space-y-6 text-center">
                  <div className="bg-[#43B047] border-4 border-black p-6 rounded-lg pixel-border">
                    <h2 className="text-xl text-[#FBD000] font-black">BARINDER'S BIRTHDAY BASH! 🎉</h2>
                    <p className="text-xs my-3 text-white">Select a game mode below:</p>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4">
                      <button onClick={() => { db.ref('rooms/' + roomCode).update({ l1Round: 0 }); changeTab('level1'); }} className="p-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded text-xs pixel-border">
                        ❓ SUPER TRIVIA
                      </button>
                      <button onClick={() => { db.ref('rooms/' + roomCode).update({ mlQuestionIdx: 0 }); changeTab('level2'); }} className="p-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded text-xs pixel-border">
                        👑 MOST LIKELY TO...
                      </button>
                      <button onClick={() => { db.ref('rooms/' + roomCode).update({ bluffIndex: 0 }); changeTab('level3'); }} className="p-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded text-xs pixel-border">
                        🕵️ BLUFFER'S DILEMMA
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* GAME 1: SUPER TRIVIA */}
              {activeTab === 'level1' && (
                <div className="space-y-6">
                  <button onClick={() => changeTab('hub')} className="text-[10px] font-bold text-yellow-400">
                    ← RETURN TO WORLD MAP
                  </button>
                  {l1Round < DEFAULT_TRIVIA.length ? (
                    <div className="bg-[#E52521] border-4 border-black p-5 rounded-lg pixel-border space-y-4">
                      <div className="flex items-center justify-between border-b-2 border-black/40 pb-3">
                        <div>
                          <span className="text-[9px] text-yellow-300 font-bold">{DEFAULT_TRIVIA[l1Round]?.difficulty}</span>
                          <h3 className="text-base md:text-xl font-black text-white mt-1">{DEFAULT_TRIVIA[l1Round]?.question}</h3>
                        </div>
                        <div className="bg-[#FBD000] text-black px-3 py-1.5 rounded pixel-border text-center">
                          <span className="text-[9px] block font-bold">PTS</span>
                          <span className="text-sm font-black">+{DEFAULT_TRIVIA[l1Round]?.points}</span>
                        </div>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 my-4">
                        {DEFAULT_TRIVIA[l1Round]?.options.map((opt, idx) => {
                          let btnBg = "bg-[#0090E0] hover:bg-blue-600 text-white";
                          if (l1Revealed) {
                            if (idx === DEFAULT_TRIVIA[l1Round].correctIndex) btnBg = "bg-[#43B047] text-white font-bold ring-4 ring-yellow-300";
                            else if (idx === l1SelectedOpt) btnBg = "bg-stone-800 text-red-300";
                          }
                          return (
                            <button key={idx} onClick={() => handleL1Answer(idx)} disabled={l1Revealed} className={"p-4 rounded border-2 border-black text-left text-xs font-bold " + btnBg}>
                              {String.fromCharCode(65 + idx)}. {opt}
                            </button>
                          );
                        })}
                      </div>
                      {l1Revealed && (
                        <button onClick={() => {
                          const nextR = l1Round + 1;
                          setL1Revealed(false);
                          setL1SelectedOpt(null);
                          db.ref('rooms/' + roomCode).update({ l1Round: nextR });
                        }} className="w-full py-3 bg-[#FBD000] text-black font-black text-xs rounded pixel-border">
                          {l1Round < DEFAULT_TRIVIA.length - 1 ? 'NEXT QUESTION →' : 'VIEW FINAL SCORES 🏆'}
                        </button>
                      )}
                    </div>
                  ) : (
                    <div className="bg-[#43B047] border-4 border-black p-6 rounded-lg pixel-border text-center space-y-4">
                      <h2 className="text-xl text-[#FBD000] font-black">SUPER TRIVIA COMPLETED! 🏆</h2>
                      <p className="text-xs text-white">Great job everyone! Check the top leaderboard for final scores.</p>
                      <button onClick={() => changeTab('hub')} className="px-6 py-3 bg-[#E52521] text-white font-black text-xs rounded pixel-border">
                        RETURN TO WORLD MAP
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* GAME 2: MOST LIKELY TO */}
              {activeTab === 'level2' && (
                <div className="space-y-6">
                  <button onClick={() => changeTab('hub')} className="text-[10px] font-bold text-yellow-400">
                    ← RETURN TO WORLD MAP
                  </button>
                  {mlQuestionIdx < MOST_LIKELY_QUESTIONS.length ? (
                    <div className="bg-[#43B047] border-4 border-black p-6 rounded-lg pixel-border space-y-4 text-center">
                      <span className="bg-[#E52521] text-white text-[10px] px-3 py-1 rounded pixel-border">VOTING ROUND ({mlQuestionIdx + 1}/{MOST_LIKELY_QUESTIONS.length})</span>
                      <h3 className="text-base md:text-xl font-black text-white">{MOST_LIKELY_QUESTIONS[mlQuestionIdx]}</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-5 gap-3 my-4">
                        {Object.values(players).map((p) => (
                          <button key={p.name} onClick={() => { addPoints(p.name, 100); alert(p.name + ' got a vote! (+100 pts)'); }} className="p-3 bg-emerald-800 hover:bg-emerald-700 border-2 border-black rounded text-xs font-bold flex flex-col items-center">
                            <span className="text-2xl mb-1">{p.avatar}</span>
                            <span>{p.name}</span>
                          </button>
                        ))}
                      </div>
                      <button onClick={() => {
                        const nextMl = mlQuestionIdx + 1;
                        db.ref('rooms/' + roomCode).update({ mlQuestionIdx: nextMl });
                      }} className="px-6 py-2 bg-[#FBD000] text-black font-bold text-xs rounded pixel-border">
                        {mlQuestionIdx < MOST_LIKELY_QUESTIONS.length - 1 ? 'NEXT QUESTION →' : 'FINISH GAME 🏆'}
                      </button>
                    </div>
                  ) : (
                    <div className="bg-[#43B047] border-4 border-black p-6 rounded-lg pixel-border text-center space-y-4">
                      <h2 className="text-xl text-[#FBD000] font-black">MOST LIKELY TO COMPLETED! 👑</h2>
                      <p className="text-xs text-white">All votes have been cast! Check out who won on hotel leaderboard.</p>
                      <button onClick={() => changeTab('hub')} className="px-6 py-3 bg-[#E52521] text-white font-black text-xs rounded pixel-border">
                        RETURN TO WORLD MAP
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* GAME 3: THE BLUFFER'S DILEMMA */}
              {activeTab === 'level3' && (
                <div className="space-y-6">
                  <button onClick={() => changeTab('hub')} className="text-[10px] font-bold text-yellow-400">
                    ← RETURN TO WORLD MAP
                  </button>
                  {bluffIndex < BLUFF_FACTS.length ? (
                    <div className="bg-[#0090E0] border-4 border-black p-6 rounded-lg pixel-border space-y-4 text-center">
                      <span className="bg-purple-600 text-white text-[10px] px-3 py-1 rounded pixel-border">FACT #{bluffIndex + 1} OF {BLUFF_FACTS.length}</span>
                      <h3 className="text-sm md:text-lg font-black text-white leading-relaxed">{BLUFF_FACTS[bluffIndex].fact}</h3>
                      {!bluffRevealed ? (
                        <div className="flex justify-center gap-4 my-4">
                          <button onClick={() => { setBluffRevealed(true); if (BLUFF_FACTS[bluffIndex].isReal) addPoints(myIdentity, 150); }} className="px-6 py-3 bg-[#43B047] text-white font-bold text-xs rounded pixel-border">
                            REAL FACT
                          </button>
                          <button onClick={() => { setBluffRevealed(true); if (!BLUFF_FACTS[bluffIndex].isReal) addPoints(myIdentity, 150); }} className="px-6 py-3 bg-[#E52521] text-white font-bold text-xs rounded pixel-border">
                            FAKE NEWS
                          </button>
                        </div>
                      ) : (
                        <div className="space-y-3">
                          <p className="text-xs font-bold text-yellow-300">{BLUFF_FACTS[bluffIndex].explanation}</p>
                          <button onClick={() => {
                            setBluffRevealed(false);
                            const nextB = bluffIndex + 1;
                            db.ref('rooms/' + roomCode).update({ bluffIndex: nextB });
                          }} className="px-6 py-2 bg-[#FBD000] text-black font-bold text-xs rounded pixel-border">
                            {bluffIndex < BLUFF_FACTS.length - 1 ? 'NEXT FACT →' : 'FINISH GAME 🏆'}
                          </button>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="bg-[#43B047] border-4 border-black p-6 rounded-lg pixel-border text-center space-y-4">
                      <h2 className="text-xl text-[#FBD000] font-black">BLUFFER'S DILEMMA COMPLETED! 🕵️</h2>
                      <p className="text-xs text-white">All facts explored! Check out who spotted the best lies.</p>
                      <button onClick={() => changeTab('hub')} className="px-6 py-3 bg-[#E52521] text-white font-black text-xs rounded pixel-border">
                        RETURN TO WORLD MAP
                      </button>
                    </div>
                  )}
                </div>
              )}
            </main>

            <footer className="bg-black border-t-4 border-black p-3 text-center text-[9px] text-zinc-400 flex justify-between items-center max-w-5xl mx-auto w-full">
              <span>LIVE MULTIPLAYER ACTIVE • BARINDER'S B-DAY</span>
              <span className="text-yellow-400 font-bold">ROOM: {roomCode}</span>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
