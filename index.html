    <script type="text/babel">

      const RetroGlobalStyles = () => (
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
          .font-pixel { font-family: 'Press Start 2P', cursive, monospace; }
          * { image-rendering: pixelated; }

          .pixel-border-gold { box-shadow: -4px 0 0 0 #2b201a, 4px 0 0 0 #2b201a, 0 -4px 0 0 #2b201a, 0 4px 0 0 #2b201a, -4px -4px 0 0 #fbd000, 4px 4px 0 0 #fbd000; }

        `}</style>
      );

      const FireworksCanvas = ({ active }) => {
        const canvasRef = useRef(null);
        useEffect(() => {
          if (!active) return;
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          const particles = [];
          const colors = ['#E52521', '#0090E0', '#FBD000', '#43B047', '#FFFFFF', '#FF00FE'];
          const createExplosion = (x, y) => {
            for (let i = 0; i < 40; i++) {
              const angle = (Math.PI * 2 * i) / 40;
              const speed = Math.random() * 5 + 2;
              particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: Math.random() * 6 + 3, color: colors[Math.floor(Math.random() * colors.length)], life: 60 });
            }
          };
          let interval = setInterval(() => { createExplosion(Math.random() * canvas.width, Math.random() * (canvas.height * 0.6)); }, 400);
          let animationId;
          const render = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx; p.y += p.vy; p.life -= 1;
              ctx.fillStyle = p.color;
              ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
              if (p.life <= 0) particles.splice(i, 1);
            }
            animationId = requestAnimationFrame(render);
          };
          render();
          return () => { clearInterval(interval); cancelAnimationFrame(animationId); };
        }, [active]);
        if (!active) return null;
        return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-50 w-full h-full" />;
      };

      const MARIO_AVATARS = [

      const DEFAULT_TRIVIA = [

        { round: 2, difficulty: "WORLD 1-2: MEDIUM", question: "How does Barinder prefer his morning brew to power up?", options: ["Black Espresso", "Hot Ginger Chai", "Iced Vanilla Latte", "Green Tea"], correctIndex: 1, points: 200 },

      ];

      const BLUFF_FACTS = [
        { fact: "Barinder once tried to build his own computer and accidentally created a makeshift toaster.", isReal: false, explanation: "Fake! He built a working PC, but it definitely didn't toast bread." },

        { fact: "Mario was originally named 'Jumpman' in his debut game Donkey Kong.", isReal: true, explanation: "Real! Nintendo later named him Mario after their landlord." },
        { fact: "Wombat poop is shaped like distinct cubes to stop it from rolling away.", isReal: true, explanation: "Real! Wombats use their square droppings to mark territory on rocks and logs." },
        { fact: "Scotland's official national animal is the Unicorn.", isReal: true, explanation: "Real! In Celtic mythology, the unicorn was a symbol of purity and power." },
        { fact: "Honey never spoils; archaeologists found 3,000-year-old edible honey in Egyptian tombs.", isReal: true, explanation: "Real! Its low moisture and acidic pH keep it edible indefinitely!" },
        { fact: "In 1998, NASA lost a $125 million Mars orbiter because one team used metric units and another used Imperial.", isReal: true, explanation: "Real! A simple unit conversion error destroyed the spacecraft!" },
        { fact: "Oxford University is older than the Aztec Empire.", isReal: true, explanation: "Real! Teaching existed at Oxford in 1096, while the Aztec Empire started around 1428." },
        { fact: "Bubble wrap was originally invented to be textured 3D wallpaper.", isReal: true, explanation: "Real! It failed as wallpaper before finding success as protective packaging." }
      ];

      const MOST_LIKELY_QUESTIONS = [

        "Who is most likely to fall asleep first during a late-night movie?",
        "Who is most likely to launch a crazy business idea with Barinder at 2 AM?",

      function App() {
        const [activeTab, setActiveTab] = useState('hub');
        const [soundEnabled, setSoundEnabled] = useState(true);
        const [fireworksActive, setFireworksActive] = useState(false);
        const [coins, setCoins] = useState(99);
        const [showShareModal, setShowShareModal] = useState(false);
        const [copiedLink, setCopiedLink] = useState(false);
        const [roomCode] = useState(() => 'BARINDER-' + Math.floor(1000 + Math.random() * 9000));

        const [triviaQuestions, setTriviaQuestions] = useState(() => {
          try {
            const saved = localStorage.getItem('barinder_custom_trivia');
            return saved ? JSON.parse(saved) : DEFAULT_TRIVIA;
          } catch (e) { return DEFAULT_TRIVIA; }
        });

        useEffect(() => {
          try { localStorage.setItem('barinder_custom_trivia', JSON.stringify(triviaQuestions)); } catch (e) {}
        }, [triviaQuestions]);

        const [players, setPlayers] = useState([
          { id: 1, name: 'BARINDER', avatar: '👑', score: 0 },
          { id: 2, name: 'PLAYER 1', avatar: '🔴', score: 0 },
          { id: 3, name: 'PLAYER 2', avatar: '🟢', score: 0 },
          { id: 4, name: 'PLAYER 3', avatar: '🍄', score: 0 },
          { id: 5, name: 'PLAYER 4', avatar: '🦖', score: 0 },
        ]);

        const [activePlayerIdx, setActivePlayerIdx] = useState(1);
        const [l1Round, setL1Round] = useState(0);
        const [l1SelectedOpt, setL1SelectedOpt] = useState(null);
        const [l1Revealed, setL1Revealed] = useState(false);
        const [mlQuestionIdx, setMlQuestionIdx] = useState(0);
        const [bluffIndex, setBluffIndex] = useState(0);
        const [bluffRevealed, setBluffRevealed] = useState(false);

        const playRetroSound = (type) => {
          if (!soundEnabled) return;
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'coin') {
              osc.type = 'square';
              osc.frequency.setValueAtTime(987.77, now);
              osc.frequency.setValueAtTime(1318.51, now + 0.08);
              gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
              osc.start(now); osc.stop(now + 0.3);
              setCoins(c => c + 1);
            } else if (type === 'jump') {
              osc.type = 'square';
              osc.frequency.setValueAtTime(150, now);
              osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
              gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
              osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'powerup') {
              osc.type = 'triangle';
              [330, 392, 659, 523, 587, 784].forEach((freq, i) => osc.frequency.setValueAtTime(freq, now + i * 0.05));
              gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
              osc.start(now); osc.stop(now + 0.35);
            } else if (type === 'wrong') {
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(180, now);
              osc.frequency.setValueAtTime(110, now + 0.15);
              gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
              osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'fanfare') {
              setFireworksActive(true);
              setTimeout(() => setFireworksActive(false), 50
